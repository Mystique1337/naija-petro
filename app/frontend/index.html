<!doctype html>
<html lang="en" class="dark h-full">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Naija-Petro · Petroleum Engineering Assistant</title>
<!-- build: ui-4 (email capture + feedback notes) -->
<meta name="description" content="Nigeria-aware petroleum engineering AI with verifiable, cited sources." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛢️</text></svg>" />
<script>tailwind = window.tailwind || {}; </script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        naija: { DEFAULT:'#16a34a', soft:'#22c55e', deep:'#0c5a32', glow:'#4ade80' },
        flare: '#f59e0b',
      },
      fontFamily: { sans:['Inter','ui-sans-serif','system-ui'], mono:['JetBrains Mono','ui-monospace','monospace'] },
    }}
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<style>
  :root{ color-scheme: dark; }
  html.dark body{ background:radial-gradient(1200px 600px at 50% -10%, #0c1813 0%, #060a08 60%); color:#dbe7e0; }
  html:not(.dark) body{ background:radial-gradient(1200px 600px at 50% -10%, #f0fdf4 0%, #f7faf8 60%); color:#0f1b15; }
  body{ font-family:'Inter',sans-serif; }
  .panel-d{ background:#0f1714; border-color:#1f2d27; }
  html:not(.dark) .panel-l{ background:#ffffff; border-color:#e3ece7; }
  .prose-petro{ line-height:1.7; font-size:.95rem; }
  .prose-petro h1,.prose-petro h2,.prose-petro h3{ font-weight:700; margin:.9em 0 .4em; line-height:1.3; }
  .prose-petro h2{ font-size:1.1rem; } .prose-petro h3{ font-size:1rem; }
  .prose-petro p{ margin:.55em 0; } .prose-petro ul,.prose-petro ol{ margin:.5em 0 .5em 1.25em; list-style:revert; }
  .prose-petro li{ margin:.25em 0; } .prose-petro a{ color:#22c55e; text-decoration:underline; }
  .prose-petro code{ background:rgba(34,197,94,.12); padding:.1em .35em; border-radius:.35em; font-size:.85em; font-family:'JetBrains Mono',monospace; }
  .prose-petro pre{ background:#0a130f; border:1px solid #1f2d27; padding:.85em; border-radius:.7em; overflow-x:auto; margin:.7em 0; }
  html:not(.dark) .prose-petro pre{ background:#0c130f; color:#e6f2ec; }
  .prose-petro pre code{ background:none; padding:0; }
  .prose-petro table{ border-collapse:collapse; margin:.7em 0; width:100%; font-size:.9em; }
  .prose-petro th,.prose-petro td{ border:1px solid #25342d; padding:.4em .65em; text-align:left; }
  html:not(.dark) .prose-petro th, html:not(.dark) .prose-petro td{ border-color:#dbe7e0; }
  .prose-petro th{ background:rgba(34,197,94,.08); }
  .cite{ display:inline-flex; align-items:center; justify-content:center; min-width:1.15rem; height:1.15rem; padding:0 .3rem;
    margin:0 .12rem; font-size:.7rem; font-weight:700; color:#04240f; background:#22c55e; border-radius:.4rem; text-decoration:none; vertical-align:.12em; }
  .cite:hover{ background:#4ade80; }
  .dot{ animation:blink 1.3s infinite both } .dot:nth-child(2){ animation-delay:.18s } .dot:nth-child(3){ animation-delay:.36s }
  @keyframes blink{ 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  .shimmer{ background:linear-gradient(90deg,rgba(34,197,94,.15),rgba(34,197,94,.45),rgba(34,197,94,.15)); background-size:200% 100%; animation:sh 1.4s linear infinite; }
  @keyframes sh{ to{ background-position:-200% 0 } }
  ::-webkit-scrollbar{ width:9px;height:9px } ::-webkit-scrollbar-thumb{ background:#22311f; border-radius:6px }
  [x-cloak]{ display:none!important }
  .reason{ font-family:'JetBrains Mono',monospace; font-size:.8rem; line-height:1.6; white-space:pre-wrap; color:#9fb3a8; }
</style>
</head>
<body class="h-full">
<div x-data="app()" x-init="init()" x-cloak class="flex flex-col h-screen max-w-4xl mx-auto">

  <!-- Header -->
  <header class="flex items-center gap-3 px-4 sm:px-6 py-3 border-b dark:border-[#1f2d27] border-[#e3ece7] sticky top-0 z-10 backdrop-blur bg-white/60 dark:bg-[#0a0f0d]/70">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-naija to-naija-deep grid place-items-center text-lg shadow-lg shadow-naija/20">🛢️</div>
    <div class="leading-tight">
      <div class="font-bold tracking-tight">Naija-Petro</div>
      <div class="text-[11px] text-naija-soft/90 font-medium">Nigeria-aware Petroleum Engineering AI</div>
    </div>
    <div class="ml-auto flex items-center gap-2 text-xs">
      <span class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full border dark:border-[#1f2d27] border-[#e3ece7]" :title="`${kb.documents} documents, ${kb.chunks} chunks`">
        <span class="w-1.5 h-1.5 rounded-full bg-naija-soft animate-pulse"></span>
        <span x-text="`${kb.chunks} sources`"></span>
      </span>
      <button @click="reasoningOn=!reasoningOn" :class="reasoningOn ? 'border-naija/60 text-naija-soft' : 'dark:border-[#1f2d27] border-[#e3ece7] opacity-60'"
        class="px-2.5 py-1 rounded-full border transition" title="Toggle the model's reasoning trace">
        💭 Reasoning <span x-text="reasoningOn?'on':'off'"></span>
      </button>
      <button @click="toggleTheme()" class="w-8 h-8 grid place-items-center rounded-full border dark:border-[#1f2d27] border-[#e3ece7]" title="Toggle theme">
        <span x-show="dark">☀️</span><span x-show="!dark">🌙</span>
      </button>
    </div>
  </header>

  <!-- Messages -->
  <main x-ref="scroll" class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-7">

    <template x-if="messages.length===0">
      <div class="max-w-2xl mx-auto text-center mt-4 sm:mt-10">
        <div class="text-5xl mb-4">🛢️</div>
        <h1 class="text-2xl font-extrabold tracking-tight mb-2">Petroleum engineering, grounded in Nigerian sources</h1>
        <p class="text-sm opacity-70 mb-7 max-w-xl mx-auto">Ask anything across drilling, reservoir, production, completions, EOR, and Nigerian regulation. Every answer cites verifiable sources (NUPRC, NMDPRA, NNPC, NEITI, the PIA 2021), and the knowledge base grows with each question.</p>
        <div class="grid sm:grid-cols-2 gap-2.5 text-left">
          <template x-for="ex in examples" :key="ex">
            <button @click="send(ex)" class="group text-sm px-4 py-3 rounded-xl border dark:border-[#1f2d27] border-[#e3ece7] dark:hover:border-naija hover:border-naija hover:bg-naija/5 transition flex items-start gap-2">
              <span class="text-naija-soft mt-0.5">→</span><span x-text="ex"></span>
            </button>
          </template>
        </div>
      </div>
    </template>

    <template x-for="(m,i) in messages" :key="i">
      <div class="max-w-3xl mx-auto w-full">
        <!-- user -->
        <template x-if="m.role==='user'">
          <div class="flex justify-end">
            <div class="bg-naija-deep/70 border border-naija/30 rounded-2xl rounded-br-md px-4 py-2.5 text-sm text-white max-w-[85%] whitespace-pre-wrap" x-text="m.content"></div>
          </div>
        </template>
        <!-- assistant -->
        <template x-if="m.role==='assistant'">
          <div class="flex gap-3">
            <div class="shrink-0 w-8 h-8 rounded-lg bg-gradient-to-br from-naija to-naija-deep grid place-items-center text-sm mt-0.5">🛢️</div>
            <div class="min-w-0 flex-1">

              <!-- live status -->
              <div x-show="m.streaming && !m.answer" class="flex items-center gap-2 text-sm text-naija-soft mb-2">
                <span class="flex gap-1 text-lg leading-none"><span class="dot">·</span><span class="dot">·</span><span class="dot">·</span></span>
                <span x-text="stageLabel(m.stage)"></span>
              </div>

              <!-- reasoning trace -->
              <template x-if="m.reasoning">
                <div class="mb-2.5 rounded-xl border dark:border-[#1f2d27] border-[#e3ece7] overflow-hidden">
                  <button @click="m.showReason=!m.showReason" class="w-full flex items-center gap-2 px-3 py-2 text-xs font-medium dark:bg-[#0c130f] bg-[#f3f8f5]">
                    <span x-show="m.thinking" class="w-2 h-2 rounded-full shimmer"></span>
                    <span>💭 Reasoning</span>
                    <span class="opacity-50" x-text="m.thinking ? '(thinking…)' : (m.showReason?'(hide)':'(show)')"></span>
                    <span class="ml-auto opacity-50" x-text="m.showReason||m.thinking?'▲':'▼'"></span>
                  </button>
                  <div x-show="m.showReason || m.thinking" class="reason px-3 py-2.5 border-t dark:border-[#1f2d27] border-[#e3ece7] max-h-72 overflow-y-auto" x-text="m.reasoning"></div>
                </div>
              </template>

              <!-- status chips -->
              <div class="flex flex-wrap gap-1.5 mb-2" x-show="m.meta">
                <span class="text-[11px] px-2 py-0.5 rounded-full border dark:border-[#1f2d27] border-[#e3ece7] opacity-80" x-show="m.sources&&m.sources.length" x-text="`grounded in ${m.sources.length} source${m.sources.length>1?'s':''}`"></span>
                <span class="text-[11px] px-2 py-0.5 rounded-full border dark:border-[#1f2d27] border-[#e3ece7] opacity-80" x-show="m.meta&&m.meta.coverage!==undefined" x-text="`coverage ${Math.round((m.meta.coverage||0)*100)}%`"></span>
                <span class="text-[11px] px-2 py-0.5 rounded-full bg-flare/15 border border-flare/40 text-flare" x-show="m.meta&&m.meta.kb_added>0" x-text="`🌱 knowledge base grew +${m.meta.kb_added}`"></span>
                <span class="text-[11px] px-2 py-0.5 rounded-full border dark:border-[#1f2d27] border-[#e3ece7] opacity-50" x-show="m.meta&&m.meta.reranked">reranked</span>
              </div>

              <!-- answer -->
              <div class="prose-petro inline" x-html="m.html"></div>
              <span x-show="m.streaming && m.answer" class="inline-block w-[7px] h-[1.05em] ml-0.5 align-text-bottom bg-naija-soft dot" aria-hidden="true"></span>
              <div x-show="m.streaming && m.answer" class="mt-1 text-[11px] text-naija-soft/80 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-naija-soft animate-pulse"></span> generating answer…
              </div>

              <!-- sources -->
              <div x-show="m.sources&&m.sources.length" class="mt-3 pt-3 border-t dark:border-[#1f2d27] border-[#e3ece7]">
                <div class="text-[11px] uppercase tracking-wide opacity-50 mb-1.5">Sources</div>
                <div class="space-y-1">
                  <template x-for="s in m.sources" :key="s.n">
                    <a :href="s.url" target="_blank" rel="noopener" class="flex items-center gap-2 text-xs opacity-90 hover:opacity-100 hover:text-naija-soft group">
                      <span class="cite shrink-0" x-text="s.n"></span>
                      <img :src="`https://www.google.com/s2/favicons?domain=${s.domain}&sz=32`" class="w-3.5 h-3.5 rounded-sm shrink-0" loading="lazy" onerror="this.style.display='none'">
                      <span class="truncate group-hover:underline" x-text="s.title"></span>
                      <span class="ml-auto shrink-0 px-1.5 rounded text-[10px] border"
                        :class="s.tier===1?'border-naija/50 text-naija-soft':s.tier===2?'border-flare/40 text-flare':'dark:border-[#1f2d27] border-[#e3ece7] opacity-60'"
                        x-text="s.tier===1?'official':s.tier===2?'reference':'news'"></span>
                    </a>
                  </template>
                </div>
              </div>

              <!-- actions -->
              <div x-show="!m.streaming && m.answer" class="flex items-center gap-1 mt-2.5 text-xs">
                <button @click="copy(m.answer,$event)" class="px-2 py-1 rounded-lg dark:hover:bg-[#16221c] hover:bg-[#eef5f1] opacity-70 hover:opacity-100" title="Copy">📋 Copy</button>
                <button @click="exportMd(m)" class="px-2 py-1 rounded-lg dark:hover:bg-[#16221c] hover:bg-[#eef5f1] opacity-70 hover:opacity-100" title="Export markdown">⬇︎ Export</button>
                <span class="mx-1 opacity-30">·</span>
                <button @click="rate(m,1)" :class="m.feedback===1?'text-naija-soft':'opacity-50 hover:opacity-100'" class="px-1.5 py-1 rounded-lg" title="Helpful">👍</button>
                <button @click="rate(m,-1)" :class="m.feedback===-1?'text-flare':'opacity-50 hover:opacity-100'" class="px-1.5 py-1 rounded-lg" title="Not helpful">👎</button>
              </div>

              <!-- optional feedback note (training signal) -->
              <div x-show="m.showComment" class="mt-2 flex gap-2 max-w-xl">
                <input x-model="m.comment" @keydown.enter="sendComment(m)" placeholder="Optional: what was good or wrong? (helps improve the model)"
                  class="flex-1 text-xs dark:bg-[#0a130f] bg-white border dark:border-[#1f2d27] border-[#e3ece7] rounded-lg px-2.5 py-1.5 outline-none focus:border-naija">
                <button @click="sendComment(m)" class="text-xs px-3 rounded-lg bg-naija/80 hover:bg-naija text-white">Send</button>
              </div>
              <div x-show="m.commentSent" class="mt-1.5 text-xs text-naija-soft">Thanks, this helps improve the model.</div>

              <!-- follow-ups -->
              <div x-show="m.followups&&m.followups.length" class="mt-3 flex flex-wrap gap-1.5">
                <template x-for="q in m.followups" :key="q">
                  <button @click="send(q)" class="text-xs px-3 py-1.5 rounded-full border dark:border-[#1f2d27] border-[#e3ece7] dark:hover:border-naija hover:border-naija hover:text-naija-soft transition" x-text="q"></button>
                </template>
              </div>

              <div x-show="m.error" class="text-sm text-red-400 mt-1" x-text="m.error"></div>
            </div>
          </div>
        </template>
      </div>
    </template>
  </main>

  <!-- Composer -->
  <footer class="border-t dark:border-[#1f2d27] border-[#e3ece7] backdrop-blur bg-white/60 dark:bg-[#0a0f0d]/70 px-4 sm:px-6 py-3">
    <div class="max-w-3xl mx-auto flex items-end gap-2">
      <textarea x-ref="ta" x-model="input" rows="1" :disabled="busy"
        @keydown.enter.prevent="!$event.shiftKey && send()" @input="autosize($event.target)"
        placeholder="Ask about drilling, reservoir, the PIA 2021, NUPRC regulations…"
        class="flex-1 resize-none max-h-40 dark:bg-[#0a130f] bg-white border dark:border-[#1f2d27] border-[#e3ece7] focus:border-naija rounded-xl px-4 py-3 text-sm outline-none placeholder:opacity-50"></textarea>
      <button @click="send()" :disabled="busy||!input.trim()"
        class="shrink-0 h-11 px-5 rounded-xl bg-naija hover:bg-naija-soft disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold text-sm transition shadow-lg shadow-naija/20">
        <span x-show="!busy">Send</span><span x-show="busy">…</span>
      </button>
    </div>
    <div class="max-w-3xl mx-auto flex items-center justify-between mt-2 text-[11px] opacity-60">
      <span>Built by <span class="font-semibold opacity-100">Ashinze Emmanuel</span>
        <a href="https://github.com/Mystique1337/naija-petro" target="_blank" rel="noopener" class="underline hover:text-naija-soft ml-1">GitHub</a> ·
        <a href="https://huggingface.co/Shinzmann" target="_blank" rel="noopener" class="underline hover:text-naija-soft">Hugging Face</a>
      </span>
      <span class="flex items-center gap-2">
        <button @click="openEmail()" class="underline hover:text-naija-soft">Get updates</button>
        <span class="hidden sm:inline opacity-70">· Qwen3-8B + dynamic RAG · verify before operational use</span>
      </span>
    </div>
  </footer>

  <!-- Email capture modal (optional, shown once) -->
  <div x-show="emailModal" x-cloak class="fixed inset-0 z-50 grid place-items-center bg-black/50 backdrop-blur-sm p-4" @click.self="dismissEmail()">
    <div class="w-full max-w-sm rounded-2xl border dark:border-[#1f2d27] border-[#e3ece7] dark:bg-[#0f1714] bg-white p-5 shadow-2xl">
      <div class="text-2xl mb-1">🛢️</div>
      <h2 class="text-lg font-bold mb-1">Stay in the loop</h2>
      <p class="text-sm opacity-70 mb-4">Get notified about new features and improvements to Naija-Petro. No spam, unsubscribe anytime.</p>
      <template x-if="!subscribed">
        <div>
          <input x-model="email" type="email" placeholder="you@example.com" @keydown.enter="subscribe()"
            class="w-full dark:bg-[#0a130f] bg-white border dark:border-[#1f2d27] border-[#e3ece7] focus:border-naija rounded-xl px-3 py-2.5 text-sm outline-none mb-3">
          <label class="flex items-center gap-2 text-xs opacity-80 mb-4 cursor-pointer select-none">
            <input type="checkbox" x-model="wantsUpdates" class="accent-naija w-4 h-4"> Send me occasional product updates
          </label>
          <div class="text-xs text-red-400 mb-2" x-show="emailError" x-text="emailError"></div>
          <div class="flex gap-2">
            <button @click="subscribe()" class="flex-1 bg-naija hover:bg-naija-soft text-white text-sm font-semibold rounded-xl py-2.5 transition">Notify me</button>
            <button @click="dismissEmail()" class="px-3 text-sm opacity-60 hover:opacity-100">No thanks</button>
          </div>
        </div>
      </template>
      <template x-if="subscribed">
        <div class="text-center py-3"><div class="text-2xl mb-1">✓</div><p class="text-sm">Thanks, you are on the list.</p></div>
      </template>
    </div>
  </div>
</div>

<script>
function app(){
  return {
    messages: [], input:'', busy:false, dark:true, reasoningOn:false,
    emailModal:false, email:'', wantsUpdates:true, subscribed:false, emailError:'',
    sessionId: uid(), userId: persistUid(),
    kb: { documents:0, chunks:0 },
    examples: [
      "Summarise the upstream fiscal terms under Nigeria's PIA 2021.",
      "What does NUPRC regulate, and how does it differ from NMDPRA?",
      "Derive the material balance equation for an undersaturated reservoir.",
      "Screening criteria for CO2 EOR in Niger Delta reservoirs?",
    ],
    init(){
      this.dark = (localStorage.getItem('np_theme')||'dark')==='dark';
      document.documentElement.classList.toggle('dark', this.dark);
      marked.setOptions({ breaks:true, gfm:true });
      this.refreshKb();
    },
    toggleTheme(){ this.dark=!this.dark; document.documentElement.classList.toggle('dark', this.dark); localStorage.setItem('np_theme', this.dark?'dark':'light'); },
    autosize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,160)+'px'; },
    scrollDown(){ this.$nextTick(()=>{ this.$refs.scroll.scrollTop=this.$refs.scroll.scrollHeight; }); },
    stageLabel(s){ return ({starting:'Connecting', searching:'Searching Nigerian sources', retrieving:'Searching sources', reasoning:'Warming the model', generating:'Generating'})[s] || 'Working'; },

    splitThink(raw){
      const o = raw.indexOf('<think>');
      const c = raw.indexOf('</think>');
      if(c!==-1){ const start=(o!==-1&&o<c)?o+7:0; return { reasoning: raw.slice(start,c).trim(), answer: raw.slice(c+8).replace(/^\s+/,''), thinking:false }; }
      if(o!==-1) return { reasoning: raw.slice(o+7), answer:'', thinking:true };
      return { reasoning:'', answer:raw, thinking:false };
    },
    render(text, sources){
      const math=[];
      const stash = (m)=>{ math.push(m); return `@@M${math.length-1}@@`; };
      text = (text||'')
        .replace(/\$\$([\s\S]+?)\$\$/g, stash)
        .replace(/\\\[([\s\S]+?)\\\]/g, stash)
        .replace(/\\\(([\s\S]+?)\\\)/g, stash);
      let html = marked.parse(text);
      html = html.replace(/@@M(\d+)@@/g, (_,i)=>math[i]);
      if(sources && sources.length){
        const byN = Object.fromEntries(sources.map(s=>[s.n, String(s.url||'').replace(/"/g,'%22')]));
        html = html.replace(/\[(\d{1,2})\]/g, (m,n)=> byN[n] ? `<a class="cite" href="${byN[n]}" target="_blank" rel="noopener">${n}</a>` : m);
      }
      return DOMPurify.sanitize(html, { ADD_ATTR:['target'] });
    },
    typeset(){ this.$nextTick(()=>{ try{ if(window.renderMathInElement) renderMathInElement(this.$refs.scroll, {
      delimiters:[{left:'\\[',right:'\\]',display:true},{left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false}], throwOnError:false }); }catch(e){} }); },

    async refreshKb(){ try{ const r=await fetch('/kb/stats'); if(r.ok){ const d=await r.json(); if(d&&d.documents!=null) this.kb=d; } }catch(e){} },

    async send(text){
      const q=(text||this.input).trim(); if(!q||this.busy) return;
      this.input=''; if(this.$refs.ta) this.$refs.ta.style.height='auto';
      this.busy=true;
      this.messages.push({ role:'user', content:q });
      const history = this.messages.filter(x=>x.role==='user'||x.role==='assistant').slice(-7,-1).map(x=>({role:x.role, content:(x.answer||x.content||'')}));
      this.messages.push({ role:'assistant', raw:'', reasoning:'', answer:'', html:'', sources:[], meta:null, streaming:true, stage:'starting', thinking:false, showReason:false, error:null, followups:[], feedback:0, traceId:null, query:q, showComment:false, comment:'', commentSent:false });
      const m = this.messages[this.messages.length-1];
      this.scrollDown();
      try{
        const resp = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ message:q, session_id:this.sessionId, user_id:this.userId, history, reasoning:this.reasoningOn }) });
        if(!resp.ok){ const t=await resp.text().catch(()=> ''); throw new Error(resp.status===429?'You are sending requests too quickly. Please wait a moment.':('Request failed ('+resp.status+')')); }
        const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf='';
        while(true){
          const {value,done}=await reader.read(); if(done) break;
          buf+=dec.decode(value,{stream:true}); let idx;
          while((idx=buf.indexOf('\n\n'))>=0){
            const line=buf.slice(0,idx).trim(); buf=buf.slice(idx+2);
            if(!line.startsWith('data:')) continue;
            let evt; try{ evt=JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
            if(evt.type==='status'){ m.stage=evt.stage; }
            else if(evt.type==='meta'){ m.sources=evt.sources||[]; m.meta=evt; m.traceId=evt.trace_id||null; if(evt.kb_added) this.refreshKb(); }
            else if(evt.type==='token'){ m.raw+=evt.t; const p=this.splitThink(m.raw); m.reasoning=p.reasoning; m.thinking=p.thinking; m.answer=p.answer; m.html=this.render(m.answer, m.sources); this.scrollDown(); }
            else if(evt.type==='followups'){ m.followups=evt.items||[]; }
            else if(evt.type==='done'){ m.streaming=false; m.thinking=false; m.html=this.render(m.answer,m.sources); this.typeset(); this.maybeAskEmail(); }
            else if(evt.type==='error'){ m.error=evt.message; m.streaming=false; m.thinking=false; }
          }
        }
      }catch(e){ m.error=String(e.message||e); }
      finally{ m.streaming=false; m.thinking=false; this.busy=false; this.refreshKb(); this.typeset(); this.scrollDown(); this.$nextTick(()=>this.$refs.ta&&this.$refs.ta.focus()); }
    },

    fbPayload(m){ return { session_id:this.sessionId, user_id:this.userId, query:m.query, rating:m.feedback, trace_id:m.traceId, answer:m.answer, sources:m.sources, comment:m.comment||'' }; },
    async rate(m, val){
      m.feedback = m.feedback===val ? 0 : val;
      m.showComment = m.feedback!==0 && !m.commentSent;
      try{ await fetch('/feedback', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(this.fbPayload(m)) }); }catch(e){}
    },
    async sendComment(m){
      m.commentSent=true; m.showComment=false;
      try{ await fetch('/feedback', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(this.fbPayload(m)) }); }catch(e){}
    },
    maybeAskEmail(){ if(!localStorage.getItem('np_sub')){ setTimeout(()=>{ if(!localStorage.getItem('np_sub')) this.emailModal=true; }, 1500); } },
    openEmail(){ this.emailError=''; this.emailModal=true; },
    dismissEmail(){ this.emailModal=false; localStorage.setItem('np_sub','dismissed'); },
    async subscribe(){
      const e=(this.email||'').trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){ this.emailError='Please enter a valid email.'; return; }
      this.emailError='';
      try{
        const r=await fetch('/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e, wants_updates:this.wantsUpdates})});
        if(r.ok){ this.subscribed=true; localStorage.setItem('np_sub','1'); setTimeout(()=>{ this.emailModal=false; }, 1500); }
        else { const d=await r.json().catch(()=>({})); this.emailError=d.error||'Could not save right now.'; }
      }catch(err){ this.emailError='Network error, please try again.'; }
    },
    copy(text, ev){ navigator.clipboard.writeText(text||'').then(()=>{ if(ev&&ev.target){ const t=ev.target.textContent; ev.target.textContent='✓ Copied'; setTimeout(()=>ev.target.textContent=t,1200); } }); },
    exportMd(m){ const blob=new Blob([m.answer||''],{type:'text/markdown'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='naija-petro-answer.md'; a.click(); URL.revokeObjectURL(a.href); },
  }
}
function uid(){ return (crypto.randomUUID? crypto.randomUUID(): 's'+Date.now()+Math.random().toString(16).slice(2)); }
function persistUid(){ let u=localStorage.getItem('np_uid'); if(!u){ u=uid(); localStorage.setItem('np_uid',u); } return u; }
</script>
