name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # F (pyflakes) + E9 (syntax errors) only: fast, high signal, no style churn.
      # Notebooks are Colab scratch code and are not linted.
      - name: Lint (pyflakes + syntax errors)
        run: ruff check --select F,E9 --extend-exclude notebooks .

      - name: Unit tests
        run: pytest
